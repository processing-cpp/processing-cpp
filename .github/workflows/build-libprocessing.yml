name: Build libprocessing renderer (all platforms)

# Builds the libprocessing fork and uploads libs/<platform>/libprocessing for each platform.
# Run it from the Actions tab. Set the repository variable LP_FORK_REPO to the fork's
# "owner/name" on GitHub; LP_FORK_REF defaults to the "fork" branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch, tag or commit to build
        required: false
        default: fork

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # older glibc, so the library runs on older distros too
            plat: linux-x64
            lib: libprocessing.so
          - os: windows-latest
            plat: windows-x64
            lib: processing.dll
          - os: macos-14         # Apple Silicon
            plat: macos-arm64
            lib: libprocessing.dylib
          - os: macos-13         # Intel
            plat: macos-x64
            lib: libprocessing.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LP_FORK_REPO }}
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p processing_ffi

      - name: Collect library and header
        shell: bash
        run: |
          dest="out/${{ matrix.plat }}/libprocessing"
          mkdir -p "$dest/include"
          cp "target/release/${{ matrix.lib }}" "$dest/"
          cp crates/processing_ffi/include/processing.h "$dest/include/"
          # Windows: the import libraries the MinGW linker can use
          for f in processing.dll.lib libprocessing.dll.a; do
            [ -f "target/release/$f" ] && cp "target/release/$f" "$dest/" || true
          done
          case "${{ runner.os }}" in
            Linux) strip --strip-unneeded "$dest/${{ matrix.lib }}" ;;
            macOS) strip -x "$dest/${{ matrix.lib }}" ;;
          esac
          ls -la "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: libprocessing-${{ matrix.plat }}
          path: out/
